name: MMT server folder list

# One-off check: logs in to the MMT web host over SFTP and lists its folders,
# so we know where the site root is before setting up the deploy (needs the SFTP_* repo secrets).
on:
  workflow_dispatch:
  push:
    branches: [claude/mmt-website-expansion-kepooc]
    paths: [.github/workflows/mmt-server-list.yml]

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass
      - name: Diagnose connection
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          getent hosts "$SFTP_HOST" | awk '{print "Host resolves to " $1}'
          timeout 15 bash -c "echo > /dev/tcp/$SFTP_HOST/22" && echo "Port 22 reachable" || echo "Port 22 NOT reachable (likely an IP allowlist or firewall)"
          timeout 15 ssh-keyscan -p 22 "$SFTP_HOST" 2>&1 | head -5 || true
          printf 'pwd\nls\nbye\n' > batch.txt
          SSHPASS="$SFTP_PASSWORD" timeout 40 sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no -oConnectTimeout=15 -P 22 -b batch.txt "$SFTP_USER@$SFTP_HOST" 2>&1 | grep -v "^debug" | head -60 || true
      - name: List folders
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; pwd; cls -la; find -d 3 .; bye" \
            -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:22" | head -300
