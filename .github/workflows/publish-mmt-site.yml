name: Publish MMT site

# "merge live": sends the staged live preview (live-preview/ on main, made by Stage live preview) to the
# jp-hardin/mmt-site repo, which the mmt.benchmarkintl.com server pulls every 5 minutes. The banner and noindex
# that mark the live preview are removed on the way, so the live site is exactly the copy that was reviewed.
# Each publish from main is tagged live-<date>-<time>; to roll back, run it with ref set to an earlier live-* tag.
# Needs the MMT_SITE_TOKEN secret (fine-grained token: mmt-site only, Contents read and write).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to publish: main (the staged live preview), or a live-* tag to roll back to'
        default: main
        required: true

permissions:
  contents: write

concurrency: publish-mmt-site

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Take the staged live preview
        run: |
          [ -f live-preview/staged.json ] || { echo "::error::Nothing is staged. Run Stage live preview first."; exit 1; }
          cat live-preview/staged.json
          python3 mid-market-practice/_build/stage.py strip live-preview
          rm live-preview/staged.json
      - name: Copy it into mmt-site
        env:
          TOKEN: ${{ secrets.MMT_SITE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Secret MMT_SITE_TOKEN is not set"; exit 1; }
          remote="https://x-access-token:${TOKEN}@github.com/jp-hardin/mmt-site.git"
          if ! git clone -q --depth 1 "$remote" site 2>/dev/null || [ -z "$(git -C site rev-parse --verify -q HEAD)" ]; then
            rm -rf site && mkdir site && git -C site init -q -b main && git -C site remote add origin "$remote"
          fi
          rsync -a --delete --exclude .git live-preview/ site/
          cd site
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git -c user.name="MMT site" -c user.email="mmt-site@users.noreply.github.com" commit -qm "Publish ${GITHUB_SHA::7}"
          git push -q origin HEAD:main
          echo "Published $(git rev-parse --short HEAD) ($(git ls-files | wc -l) files)"
      - name: Tell search engines the site changed (IndexNow)
        if: ${{ !startsWith(inputs.ref, 'live-') }}
        continue-on-error: true
        run: |
          key=$(ls live-preview/*.txt | xargs -n1 basename | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          [ -n "$key" ] || { echo "No IndexNow key file"; exit 0; }
          urls=$(grep -o '<loc>[^<]*</loc>' live-preview/sitemap.xml | sed 's#</\?loc>##g')
          host=$(echo "$urls" | head -1 | sed -E 's#https?://([^/]+)/.*#\1#')
          echo "Waiting for the server to pull the new copy"; sleep 420
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://$host/$key.txt")
          [ "$code" = 200 ] || { echo "https://$host/$key.txt is not reachable yet ($code); skipping"; exit 0; }
          body=$(python3 -c 'import json,sys; u=sys.argv[3].split(); print(json.dumps({"host":sys.argv[1],"key":sys.argv[2],"keyLocation":"https://%s/%s.txt"%(sys.argv[1],sys.argv[2]),"urlList":u}))' "$host" "$key" "$urls")
          curl -s -w "IndexNow %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" -d "$body" https://api.indexnow.org/indexnow
      - name: Label this live version
        if: ${{ !startsWith(inputs.ref, 'live-') }}
        run: |
          tag="live-$(TZ=America/New_York date +%Y-%m-%d-%H%M)"
          git tag "$tag" && git push -q origin "$tag" && echo "Tagged $tag"
