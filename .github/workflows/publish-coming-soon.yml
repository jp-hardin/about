name: Publish coming soon page

# Replaces the live site (jp-hardin/mmt-site, served at mmt.benchmarkintl.com) with the Benchmark-branded coming soon
# page in mid-market-practice/_build/coming-soon/. The page has no links, and its images are built into it, so
# index.html is the only file left in mmt-site. The sandbox and the live preview are not touched.
# To bring the full site back, run Publish MMT site with ref main (the staged copy) or a live-* tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: publish-mmt-site

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the coming soon copy
        run: |
          mkdir cs
          python3 - <<'PY'
          import base64
          src = open('mid-market-practice/_build/coming-soon/index.html').read()
          img = 'mid-market-practice/assets/img/brand/'
          for name, mime in (('benchmark-logo-white.png', 'image/png'), ('knot-dark.jpg', 'image/jpeg'), ('favicon.png', 'image/png')):
              data = base64.b64encode(open(img + name, 'rb').read()).decode()
              src = src.replace('/assets/img/brand/' + name, 'data:%s;base64,%s' % (mime, data))
          src = src.replace('content="ROBOTS"', 'content="index, follow"')
          assert '/assets/' not in src and '<a ' not in src
          open('cs/index.html', 'w').write(src)
          PY
          ls -l cs
      - name: Copy it into mmt-site
        env:
          TOKEN: ${{ secrets.MMT_SITE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Secret MMT_SITE_TOKEN is not set"; exit 1; }
          remote="https://x-access-token:${TOKEN}@github.com/jp-hardin/mmt-site.git"
          git clone -q --depth 1 "$remote" site
          rsync -a --delete --exclude .git cs/ site/
          cd site
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git -c user.name="MMT site" -c user.email="mmt-site@users.noreply.github.com" commit -qm "Coming soon page (${GITHUB_SHA::7})"
          git push -q origin HEAD:main
          echo "Published $(git rev-parse --short HEAD) ($(git ls-files | wc -l) files)"
