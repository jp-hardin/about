name: Stage live preview

# "merge live preview": builds the site from main the way it will go live (industry reports hidden unless
# reports is set to shown), marks every page with a Live preview banner and noindex, and commits it to
# mmt-preview-38yb8qpa58/ on main, which GitHub Pages serves at /about/mmt-preview-38yb8qpa58/. "merge live" (Publish MMT site)
# then sends exactly this staged copy, without the banner, to mmt-site.
on:
  workflow_dispatch:
    inputs:
      reports:
        description: 'Industry reports on the live site'
        type: choice
        options: [hidden, shown]
        default: hidden

permissions:
  contents: write
  pages: write

concurrency: publish-mmt-site

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site as it will go live
        env:
          MMT_REPORTS: ${{ inputs.reports == 'shown' && 'on' || 'off' }}
          MMT_SITE_URL: https://mmt.benchmarkintl.com/
        run: |
          pip install -q pillow
          if [ "${{ inputs.reports }}" = "shown" ]; then
            # the report pages are built from the decks by brief.py, not by build.py: rebuild them for the live address
            pip install -q python-pptx pypdf lxml
            for d in mmt-sandbox-pvxyebvoxa/_build/reports/*-q*-*/; do
              python3 mmt-sandbox-pvxyebvoxa/_build/reports/brief.py "$(basename "$d")" --page-only
            done
          fi
          python3 mmt-sandbox-pvxyebvoxa/_build/build.py > /dev/null
      - name: Copy it to mmt-preview-38yb8qpa58 and mark it
        run: |
          mkdir -p mmt-preview-38yb8qpa58
          rsync -a --delete --exclude _build/ --exclude README.md mmt-sandbox-pvxyebvoxa/ mmt-preview-38yb8qpa58/
          python3 mmt-sandbox-pvxyebvoxa/_build/stage.py mark mmt-preview-38yb8qpa58 "$GITHUB_SHA" "${{ inputs.reports }}"
          printf '{"commit": "%s", "staged": "%s", "reports": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" "${{ inputs.reports }}" > mmt-preview-38yb8qpa58/staged.json
      - name: Commit the live preview
        run: |
          git add -A mmt-preview-38yb8qpa58
          if git diff --cached --quiet; then echo "Live preview already matches main"; exit 0; fi
          git -c user.name="MMT site" -c user.email="mmt-site@users.noreply.github.com" commit -qm "Stage live preview from ${GITHUB_SHA::7} (reports ${{ inputs.reports }})"
          git push -q origin HEAD:main
          curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Staged at https://jp-hardin.github.io/about/mmt-preview-38yb8qpa58/"
